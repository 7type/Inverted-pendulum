controller_manager:
  ros__parameters:
    use_sim_time: true
    update_rate: 200  # 控制频率 200Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    cart_effort_controller:
      type: effort_controllers/JointGroupEffortController

joint_state_broadcaster:
  ros__parameters:
    joints:
      - cart_joint
      - pole_joint

cart_effort_controller:
  ros__parameters:
    joints:
      - cart_joint
    command_interfaces:
      - effort
    state_interfaces:
      - position
      - velocity
